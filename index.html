<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5b21b6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="미니게임">
  <title>미니게임 모음</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <section id="home" class="screen active">
      <header class="home-header">
        <h1>🎮 미니게임 모음</h1>
        <button id="sound-toggle" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
      </header>
      <div id="game-list" class="game-grid"></div>
    </section>

    <section id="play" class="screen">
      <header class="hud">
        <button id="back-btn" class="icon-btn" aria-label="메뉴로 돌아가기">←</button>
        <div id="hud-title" class="hud-title"></div>
        <div id="hud-info" class="hud-info"></div>
      </header>
      <main id="stage-wrap" class="stage-wrap"></main>

      <div id="overlay" class="overlay hidden">
        <div class="panel">
          <div id="ov-emoji" class="panel-emoji"></div>
          <h2 id="ov-title"></h2>
          <p id="ov-text"></p>
          <p id="ov-best" class="panel-best"></p>
          <div class="panel-buttons">
            <button id="ov-secondary" class="btn">메뉴</button>
            <button id="ov-primary" class="btn primary">시작!</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
  <script src="js/games/balloon.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/numbers.js"></script>
  <script src="js/games/reaction.js"></script>
  <script src="js/games/color.js"></script>
  <script src="js/games/tictactoe.js"></script>
</body>
</html>
